services:
  # Postgres
  postgres-prod:
    image: postgres:16-alpine
    container_name: mini-inventory-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_network
    restart: unless-stopped

  # Redis
  redis-prod:
    image: redis:7-alpine
    container_name: mini-inventory-redis-prod
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD}",
          "ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data
    networks:
      - private_network
    restart: unless-stopped

  backend-prod:
    build: 
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: mini-inventory-backend-prod
    environment:
      NODE_ENV: production

      API_PORT: ${API_PORT}
      API_PREFIX: ${API_PREFIX}
      
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/health').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    networks:
      - private_network
    restart: unless-stopped
  
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: mini-inventory-frotnend-prod
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    healthcheck:
      test: 
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend-prod:
        condition: service_healthy
    networks:
      - private_network
    restart: unless-stopped
  
  # Nginx
  nginx-prod:
    image: nginx:alpine
    container_name: mini-inventory-nginx-prod
    ports:
      - "80:80"
    depends_on:
      frontend-prod:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - private_network
      - public_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  public_network:
    driver: bridge
  private_network:
    driver: bridge
    internal: true

    